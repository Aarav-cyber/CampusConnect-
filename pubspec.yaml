name: campus_connect
description: "CampusConnect - Real-Time Student Networking & Campus Community Platform"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: 2.2.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  path_provider_foundation: 2.4.0
  shared_preferences_foundation: 2.3.5


flutter:
  uses-material-design: true
  assets:
    - assets/images/
